<style>

.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;color:#fff;background:var(--ac)}

.grid{display:grid;gap:12px;padding:12px 16px;grid-template-columns:1fr}

svg{display:block;width:100%;height:auto;max-height:78vh}
.mk{cursor:pointer}.mk text{font:700 10px sans-serif;fill:#fff;pointer-events:none}
.list{display:flex;flex-direction:column;gap:8px}
.st{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:10px 12px;cursor:pointer}
.st.sel{border-color:var(--c)}
.st h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;display:grid;place-items:center;background:var(--c)}
.t{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
.mt{font-size:13px;color:var(--sub);margin:4px 0 0}
.dt{display:none;margin-top:8px}.st.sel .dt{display:block}
.dt p{margin:4px 0}.ac{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tbl{margin:4px 16px 24px;background:var(--card);border-radius:14px;border:1px solid var(--ln);padding:12px 14px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
.tbl th:nth-child(n+2),.tbl td:nth-child(n+2){text-align:right}
.note{font-size:12px;color:var(--sub);margin:8px 0 0}
</style></head><body>

const C=[[127.67,26.08],[127.64,26.14],[127.65,26.21],[127.67,26.28],[127.7,26.34],[127.73,26.42],[127.78,26.5],[127.86,26.55],[127.9,26.62],[127.87,26.7],[127.94,26.72],[128.03,26.74],[128.14,26.82],[128.26,26.88],[128.27,26.82],[128.18,26.72],[128.1,26.6],[128.03,26.5],[127.96,26.44],[127.97,26.36],[127.95,26.29],[127.88,26.24],[127.8,26.2],[127.82,26.13],[127.76,26.07]];
const P=(la,lo)=>[+((lo-127.6)*500).toFixed(1),+((26.92-la)*500).toFixed(1)];
const E=encodeURIComponent,$=i=>document.getElementById(i);
let day=0,sel=0;
const idx=d=>S.map((s,i)=>i).filter(i=>S[i][0]==d);
const nav=(s,k)=>`https://www.google.com/maps/dir/?api=1&destination=${E(k?s[2]:(s[10]||s[2]))}&travelmode=${s[9]=="t"?"transit":"driving"}`;
const loc=s=>`https://www.google.com/maps/search/?api=1&query=${E(s[10]||s[2])}`;
function dayNav(d){const q=idx(d).map(i=>S[i]).filter(s=>s[9]!="t").map(s=>[0,0,s[10]||s[2]]);
 return `https://www.google.com/maps/dir/?api=1&origin=${E(q[0][2])}&destination=${E(q[q.length-1][2])}&waypoints=${E(q.slice(1,-1).map(s=>s[2]).join("|"))}&travelmode=driving`}
function tot(d){let m=0,e=0;idx(d).forEach(i=>{m+=S[i][6];e+=S[i][7]});return[m,e]}
function draw(){
 const c=COL[day],ids=idx(day);
 if(!ids.includes(sel))sel=ids[0];
 $("tabs").innerHTML=DAYS.map((x,i)=>`<button class="${i==day?"on":""}" style="${i==day?"background:"+COL[i]:""}" onclick="day=${i};sel=0;draw()">${x[0]}</button>`).join("");
 const [m,e]=tot(day);
 $("sum").innerHTML=`<b style="color:${c}">${DAYS[day][1]}</b><span class="chip">⏱ 車程合計約 ${Math.floor(m/60)} 小時 ${m%60} 分</span><span class="chip">🛣️ ETC 約 ¥${e.toLocaleString()}</span><span class="chip">${DAYS[day][2]}</span><a class="btn" style="background:${c}" target="_blank" rel="noopener" href="${dayNav(day)}">🧭 整日導航(Google)</a>`;
 let g=`<rect width="360" height="450" fill="var(--sea)"/><path d="M${C.map(p=>P(p[1],p[0]).join(",")).join("L")}Z" fill="var(--land)" stroke="var(--ln)" stroke-width="2"/>`;
 g+=`<text x="285" y="30" font-size="11" fill="var(--sub)">國頭</text><text x="190" y="200" font-size="11" fill="var(--sub)">中部</text><text x="95" y="372" font-size="11" fill="var(--sub)">那霸</text><text x="10" y="440" font-size="9" fill="var(--sub)">示意圖</text>`;
 S.forEach((s,i)=>{if(s[0]!=day){const[x,y]=P(s[3],s[4]);g+=`<circle cx="${x}" cy="${y}" r="3" fill="${COL[s[0]]}" opacity=".3"/>`}});
 const pts=ids.map(i=>P(S[i][3],S[i][4]));
 g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="6 4" opacity=".8"/>`;
 ids.forEach((i,k)=>{const[x,y]=pts[k],on=i==sel;g+=`<g class="mk" onclick="sel=${i};draw();document.getElementById('s${i}').scrollIntoView({block:'nearest',behavior:'smooth'})"><circle cx="${x}" cy="${y}" r="${on?13:10}" fill="${c}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+3.5}" text-anchor="middle">${k+1}</text></g>`});
 $("svg").innerHTML=g;
 $("list").innerHTML=ids.map((i,k)=>{const s=S[i],on=i==sel;

  <div class="mt">${k?`⏱ 約 ${s[6]} 分${s[7]?`・🛣️ ETC 約 ¥${s[7]}`:""}`:"起點"}</div>

}
let rows="<tr><th>日期</th><th>車程</th><th>ETC 約</th></tr>",T=[0,0];
DAYS.forEach((x,d)=>{const[m,e]=tot(d);T[0]+=m;T[1]+=e;rows+=`<tr><td>${x[0]}</td><td>${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}</td><td>¥${e.toLocaleString()}</td></tr>`});
rows+=`<tr><th>合計</th><th>${Math.floor(T[0]/60)}h${String(T[0]%60).padStart(2,"0")}</th><th>¥${T[1].toLocaleString()}</th></tr>`;

</script></body></html>
